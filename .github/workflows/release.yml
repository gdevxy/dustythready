# Push a tag like v1.0.1 and this builds the zip (following .pkgmeta) and attaches it to a GitHub Release.
# CurseForge builds and publishes its own copy from the same tag (project setting
# "package any new tagged commits"), so no CurseForge token is needed here.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}  # optional: only used if set and the toc has X-Wago-ID
