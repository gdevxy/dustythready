# Push a tag like v1.0.1 and this builds DustyThready-<version>.zip and attaches it to a GitHub Release.
# CurseForge uploads are covered in docs/PUBLISHING.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/stage
          cp -r DustyThready dist/stage/
          rm -f dist/stage/DustyThready/Media/icon-source.jpg
          (cd dist/stage && zip -r "../DustyThready-${VERSION}.zip" DustyThready)
          echo "ZIP=dist/DustyThready-${VERSION}.zip" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
